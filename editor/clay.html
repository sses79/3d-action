<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><title>Animation Studio · Clay reference</title><link rel="stylesheet" href="style.css"><style>
.header-actions a.link{color:#b7c1ce;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:8px 12px;text-decoration:none}.header-actions a.link:hover{background:#283343;color:#fff}.header-actions select{max-width:260px}
.clay-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100vh - 70px)}.clay-layout main{min-width:0}
.clay-stage{position:relative;background:#0c1119;display:grid;place-items:center;padding:14px}.clay-canvas{width:100%;max-width:calc((100vh - 330px)*16/9);min-width:280px;aspect-ratio:16/9;background:#1b2330}.clay-canvas canvas{width:100%!important;height:100%!important;display:block}
.clay-tags{position:absolute;left:24px;top:24px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.clay-tags span{background:#131a25dd;border:1px solid #4d5969;border-radius:4px;font-size:11px;padding:5px 9px;color:#dbe3ec}.clay-tags i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.clay-rows{position:relative;margin-top:6px;overflow:hidden;padding-bottom:2px}.timeline .scrub{margin-left:92px;width:calc(100% - 92px)}.clay-row{position:relative;height:30px;margin-top:6px;margin-left:92px;background:#161d28;border-radius:3px}.clay-row label{position:absolute;left:-92px;top:8px;width:86px;font-size:10px;letter-spacing:.6px;color:var(--muted);margin:0}
.clay-row button{position:absolute;top:2px;height:26px;padding:0 6px;font-size:10px;border-radius:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;border:1px solid #10151e}.clay-row button.shot{background:#35507a;color:#dbe8fb}.clay-row button.beat{background:#414a3a;color:#e2e8cf}.clay-row button.range{background:#2a3240;color:#b7c1ce}.clay-row button.off{background-image:repeating-linear-gradient(135deg,transparent 0 6px,#e8ba6540 6px 9px);border-color:#a5803d}.clay-row button.now{outline:2px solid var(--gold);outline-offset:-1px;color:#fff}
.clay-row.ticks{height:16px;background:none}.clay-row.ticks i{position:absolute;top:0;font:10px ui-monospace,monospace;color:#6e7c8f;transform:translateX(-50%);font-style:normal}.clay-row.ticks b{position:absolute;top:0;bottom:-120px;width:1px;background:var(--gold);pointer-events:none;z-index:2}
.clay-now{min-height:20px;margin:12px 0 0 92px;color:#d1d8e1}.clay-legend{margin:4px 0 0 92px;font-size:10px}.clay-legend i{display:inline-block;width:18px;height:9px;vertical-align:middle;margin-right:6px;border:1px solid #a5803d;background:repeating-linear-gradient(135deg,transparent 0 6px,#e8ba6540 6px 9px)}
.clay-checks{list-style:none;margin:0;padding:0;display:grid;gap:9px}.clay-checks li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}.clay-checks b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px}.clay-checks strong{display:block;font-size:12px;font-weight:600}.clay-checks small{display:block;color:var(--muted);font-size:11px;line-height:1.5;margin-top:2px;overflow-wrap:anywhere}
.clay-checks .ok b{background:#1f3d2c;color:#7fd6a0}.clay-checks .fail b{background:#4a2323;color:#ff9c8f}.clay-checks .warn b{background:#4a3c1c;color:var(--gold)}.clay-checks .wait b{background:#2a3240;color:var(--muted)}
.clay-problems{margin-top:12px;font-size:11px}.clay-problems summary{cursor:pointer;color:#ff9c8f}.clay-problems ul{list-style:none;margin:8px 0 0;padding:0;max-height:180px;overflow:auto;display:grid;gap:4px}.clay-problems button{width:100%;text-align:left;font-size:11px;padding:5px 8px}
.clay-copy{display:grid;gap:12px}.clay-copy-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.clay-copy-head strong{font-size:12px}.clay-copy-head button{font-size:10px;padding:4px 8px}.clay-copy p{margin:6px 0 0;padding:9px;border:1px solid var(--line);border-radius:6px;white-space:pre-wrap;color:#c7d0db;font-size:11px;line-height:1.55;overflow-wrap:anywhere}.clay-copy small{color:var(--muted);font-size:10px;line-height:1.5}
.right label.clay-option{margin-top:0;font-size:11px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}.clay-export{width:100%;margin:12px 0}.clay-foot{font-size:10px}.clay-foot a{color:#a7b5c9}.note{overflow-wrap:anywhere}
.clay-edit{padding:6px 20px 24px}.clay-shots tr.now td{background:rgba(232,197,58,.16)}.clay-shots tbody tr{cursor:pointer}.clay-edit-grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1fr);gap:20px;align-items:start}.clay-plan{width:100%;max-height:420px;background:#161d28;border:1px solid var(--line);border-radius:6px;touch-action:none;user-select:none}.clay-plan .obj{fill:#3a4454;stroke:#566175;stroke-width:.02}.clay-plan .sight{stroke:#e8ba65;stroke-width:.02;stroke-dasharray:.08 .06;opacity:.7}.clay-plan .cam{fill:#141a24;stroke:#e8ba65;stroke-width:.035;cursor:grab}.clay-plan .camn{fill:#e8ba65;font-size:.17px;text-anchor:middle;pointer-events:none;font-weight:700}.clay-plan .look{fill:#e8ba65;cursor:grab}.clay-plan .mark{fill:#8e949c;stroke:#10151e;stroke-width:.03;cursor:grab}.clay-plan .lbl{fill:#dbe3ec;font-size:.15px;text-anchor:middle;pointer-events:none}.clay-shots table{width:100%;border-collapse:collapse;font-size:11px}.clay-shots th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px 6px 0}.clay-shots td{padding:3px 6px 3px 0}.clay-shots input,.clay-shots select{width:100%;min-width:52px;background:#111b29;color:#e6edf5;border:1px solid #344153;border-radius:5px;padding:5px 6px;font-size:11px}.clay-shots .group{margin-top:12px;flex-wrap:wrap}.clay-shots .group button{font-size:11px}@media(max-width:1200px){.clay-edit-grid{grid-template-columns:1fr}}
.clay-error{background:#4a2323;color:#ffd5cf;padding:10px 25px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.clay-stage .loading{inset:14px}
@media(max-width:1000px){.clay-layout{grid-template-columns:1fr}.clay-layout aside.right{display:block;border-left:0;border-top:1px solid var(--line)}.clay-canvas{max-width:100%}.clay-row,.clay-now,.clay-legend{margin-left:0}.clay-row label{display:none}}
.vc-video{display:block;object-fit:contain;background:#000}.vc-key{text-align:center!important;padding:0!important}
.vc-keys{padding:10px 20px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}.vc-card{border:1px solid var(--line);border-radius:8px;padding:12px;background:#121925}.vc-card.now{border-color:var(--gold)}
.vc-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.vc-head button{font-size:12px;font-weight:600;padding:5px 10px}.vc-head span{color:var(--muted);font-size:11px}
.vc-stills{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 0}.vc-stills figure{margin:0}.vc-stills img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:4px;background:#000}.vc-stills figcaption{font-size:10px;color:var(--muted);margin-top:3px}
.vc-sum{margin:10px 0 6px;color:#dbe3ec;font-size:12px;line-height:1.5}.vc-people{width:100%;border-collapse:collapse;font-size:11px;line-height:1.45}.vc-people th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px 4px 0}.vc-people td{padding:4px 6px 4px 0;vertical-align:top;color:#c7d0db;border-top:1px solid #222c3a}.vc-people td:first-child{white-space:nowrap}.vc-people i,.vc-cast i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.vc-people small{color:var(--gold)}
.vc-card .clay-copy{margin-top:10px}.vc-help{font-size:11px;line-height:1.55;color:var(--muted)}.vc-cast{display:grid;gap:10px}.vc-cast label{margin:0;display:grid;gap:4px;font-size:11px}.vc-cast input{width:100%;background:#111b29;color:#e6edf5;border:1px solid #344153;border-radius:5px;padding:6px 8px;font-size:11px}
@media(max-width:700px){.vc-keys{grid-template-columns:1fr;padding:10px 12px}}
</style></head><body><div id="root"></div><script type="module" src="clay.js"></script></body></html>
