<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><title>Animation Studio · Scenes</title><link rel="stylesheet" href="style.css"><style>
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px}
.sc-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:#161d28;border:1px solid var(--line);border-radius:8px;padding:10px;color:#e6ecf2;cursor:pointer}.sc-card:hover{border-color:#5b6b80}
.sc-card img,.sc-none{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;background:#0c1119}.sc-none{display:grid;place-items:center;color:#7d8896;font-size:12px}.sc-none.big{aspect-ratio:16/9;margin:0 16px}
.sc-card small{color:#9aa6b4;font-size:12px}
.sc-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100vh - 70px)}.sc-layout main{min-width:0;padding-bottom:30px}
.sc-layout aside{border-left:1px solid var(--line);padding:16px;overflow:auto}.sc-layout aside h2{font-size:11px;letter-spacing:.08em;color:#8d99a8;margin:18px 0 8px}
.sc-bar{display:flex;gap:12px;align-items:center;padding:12px 16px}.sc-bar span{color:#8d99a8;font-size:12px}
.sc-video{display:block;width:calc(100% - 32px);margin:0 16px;aspect-ratio:16/9;background:#000;border-radius:6px}
main h3{font-size:12px;letter-spacing:.06em;color:#8d99a8;margin:18px 16px 8px}
.sc-lines{margin:0 16px;padding-left:22px}.sc-lines li{padding:6px 8px;border-radius:4px;cursor:pointer;color:#d6dde6}.sc-lines li:hover{background:#1c2533}.sc-lines li.now{background:#24324a}.sc-lines b{color:#fff;margin-right:6px}.sc-lines small{color:#7d8896;margin-left:8px}
.sc-keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:0 16px}.sc-keys figure{margin:0;cursor:pointer}.sc-keys img{width:100%;border-radius:5px;display:block}.sc-keys figcaption{font-size:12px;color:#b9c3cf;margin-top:4px}
.sc-help{color:#9aa6b4;font-size:12px;line-height:1.5}.sc-cardtext{font-size:13px;line-height:1.55;color:#dbe3ec;background:#161d28;border-radius:6px;padding:10px}
.sc-cast{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}.sc-cast label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}.sc-cast small{color:#8d99a8}
.sc-shots{padding-left:20px;font-size:12px;color:#b9c3cf;line-height:1.6}.sc-error{color:#f08a7e;font-size:12px;padding:8px 16px}
@media (max-width:820px){.sc-layout{grid-template-columns:1fr}.sc-layout aside{border-left:0;border-top:1px solid var(--line)}}
</style></head><body><div id="root"></div><script type="module" src="scenes.js"></script></body></html>
